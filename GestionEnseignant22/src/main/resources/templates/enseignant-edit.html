<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Modifier un Enseignant</title>
</head>
<body>

<h1>Modification de l'Enseignant</h1>

<form th:action="@{/updateEnseignant}" th:object="${enseignant}" method="post">

  <input type="hidden" th:field="*{id}" />

  <div>
    <label for="nom">Nom :</label>
    <input type="text" id="nom" th:field="*{nom}" required>
  </div>

  <div>
    <label for="prenom">Prénom :</label>
    <input type="text" id="prenom" th:field="*{prenom}" required>
  </div>

  <div>
    <label for="email">Email :</label>
    <input type="email" id="email" th:field="*{email}" required>
  </div>

  <button type="submit">Enregistrer les modifications</button>

</form>

<hr/>
<a th:href="@{/}">Retour à la liste</a>

</body>
</html>
